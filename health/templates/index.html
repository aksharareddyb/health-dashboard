<!DOCTYPE html>
<html>
<head>
    <title>Personal Health Dashboard</title>

<style>
.container {
    width: 90%;
    margin: auto;
    text-align: center;
}

.row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-top: 30px;
}

.card {
    width: 30%;
    background: rgb(176, 167, 167);
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
    transform: scale(1.05);
    box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
}

input {
    width: 90%;
    padding: 8px;
    margin: 10px 0;
}

button {
    width: 95%;
    padding: 10px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #45a049;
}

.bottom-buttons {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 20px;
}

.bottom-buttons button {
    width: 200px;
}

#status {
    margin-top: 20px;
    font-weight: bold;
}

#summary {
    margin-top: 20px;
    padding: 15px;
    background: #f1f1f1;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Personal Health Dashboard</h1>

    <div class="row">

        <div class="card">
            <h3>Add Workout</h3>
            <input type="number" id="workout" placeholder="Minutes">
            <button onclick="addWorkout()">Add</button>
        </div>

        <div class="card">
            <h3>Add Meal</h3>
            <input type="number" id="meal" placeholder="Calories">
            <button onclick="addMeal()">Add</button>
        </div>

        <div class="card">
            <h3>Add Sleep</h3>
            <input type="number" id="sleep" placeholder="Hours">
            <button onclick="addSleep()">Add</button>
        </div>

    </div>

    <div id="status"></div>

    <div id="summary"></div>

    <div class="bottom-buttons">
        <a href="/history/"><button>View History</button></a>
        <a href="/summary-page/"><button>View Daily Summary</button></a>
    </div>

</div>

<script>
const baseURL = "http://127.0.0.1:8080";

function showMessage(msg, type="success") {
    const status = document.getElementById("status");
    status.innerHTML = msg;
}

// ✅ WORKOUT API
function addWorkout() {
    let duration = document.getElementById("workout").value;

    fetch(baseURL + "/add-workout/", {
        method: "POST",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ duration: duration })
    })
    .then(() => {
        showMessage("Workout added ✅");
        document.getElementById("workout").value = "";
        getSummary();
    });
}

// ✅ MEAL API
function addMeal() {
    let calories = document.getElementById("meal").value;

    fetch(baseURL + "/add-meal/", {
        method: "POST",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ calories: calories })
    })
    .then(() => {
        showMessage("Meal added ✅");
        document.getElementById("meal").value = "";
        getSummary();
    });
}

// ✅ SLEEP API
function addSleep() {
    let hours = document.getElementById("sleep").value;

    fetch(baseURL + "/add-sleep/", {
        method: "POST",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ hours: hours })
    })
    .then(() => {
        showMessage("Sleep added ✅");
        document.getElementById("sleep").value = "";
        getSummary();
    });
}

// ✅ SUMMARY API
function getSummary() {
    fetch(baseURL + "/summary/")
    .then(response => response.json())
    .then(data => {
        document.getElementById("summary").innerHTML =
            "<b>Today's Summary</b><br><br>" +
            "🏋 Workout: " + data.workout + "<br>" +
            "🍔 Calories: " + data.calories + "<br>" +
            "😴 Sleep: " + data.sleep;
    });
}

window.onload = getSummary;
</script>

</body>
</html>
